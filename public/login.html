<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){const t=localStorage.getItem("loop_theme")||(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);})();</script>
  <link rel="stylesheet" href="/css/style.css" />
  <title>Log in — Lufi</title>
</head>
<body>
<header id="topbar" class="topbar"></header>
<div class="card form-card">
  <h2>Welcome back</h2>
  <div class="alert" id="error" hidden></div>
  <form id="form">
    <div class="field"><label for="login">Username or email</label><input id="login" required autocomplete="username" /></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" /></div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="helper">New to Lufi? <a href="/register.html">Create an account</a></p>
  <p class="helper" style="margin-top:6px">Demo: <b>ada</b> / <b>password123</b></p>
</div>
<script src="/js/app.js"></script>
<script>
initHeader();
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const box = document.getElementById("error");
  box.hidden = true;
  try {
    await api("/auth/login", { method: "POST", body: JSON.stringify({
      login: document.getElementById("login").value,
      password: document.getElementById("password").value,
    })});
    location.href = safeNext("/");
  } catch (err) { box.textContent = err.message; box.hidden = false; }
});
</script>
</body></html>
