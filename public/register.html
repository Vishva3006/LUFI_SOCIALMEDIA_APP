<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/lufi-icon.png" type="image/png" />
  <script>(function(){const t=localStorage.getItem("loop_theme")||(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);})();</script>
  <link rel="stylesheet" href="/css/style.css" />
  <title>Sign up — Lufi</title>
</head>
<body>
<header id="topbar" class="topbar"></header>
<div class="card form-card">
  <h2>Join Lufi</h2>
  <div class="alert" id="error" hidden></div>
  <form id="form">
    <div class="field"><label for="displayName">Name</label><input id="displayName" required maxlength="50" autocomplete="name" /></div>
    <div class="field"><label for="username">Username</label><input id="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" title="3–20 letters, numbers, or underscores" autocomplete="username" /></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email" /></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="new-password" /></div>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </form>
  <p class="helper">Already on Lufi? <a href="/login.html">Log in</a></p>
</div>
<script src="/js/app.js"></script>
<script>
initHeader();
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const box = document.getElementById("error");
  box.hidden = true;
  try {
    await api("/auth/register", { method: "POST", body: JSON.stringify({
      displayName: document.getElementById("displayName").value,
      username: document.getElementById("username").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    })});
    location.href = safeNext("/");
  } catch (err) { box.textContent = err.message; box.hidden = false; }
});
</script>
</body></html>
